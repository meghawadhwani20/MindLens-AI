<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindLens AI - Sign Up</title>
  <meta name="description" content="Create your MindLens AI account for personalized mental wellness" />
  <meta name="author" content="MindLens AI" />
  <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/auth.css') }}" />
</head>

<body class="bg-gradient auth-page">
  <div class="min-vh-100 d-flex align-items-center justify-content-center p-4 auth-shell">
    <div class="w-100 auth-panel">
      <div class="text-center auth-brand">
        <div class="d-flex align-items-center justify-content-center gap-3 mb-4">
          <div class="auth-brand-badge">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
              stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v20" />
              <path d="M2 12h20" />
            </svg>
          </div>
          <div class="text-start">
            <h1 class="h2 fw-bold auth-brand-title m-0">MindLens</h1>
            <p class="small m-0 auth-brand-subtitle">AI Wellness</p>
          </div>
        </div>
        <h2 class="h4 auth-heading">Create account</h2>
        <p class="auth-subheading">Start your personalized wellness journey</p>
      </div>
      <div class="card wellness-card border-0 mb-4 auth-card">
        <div class="card-body">
          <h3 class="h5 text-center mb-1 d-flex align-items-center justify-content-center gap-2 auth-form-title">
            <span class="icon-sm">&#10149;</span>
            Sign Up
          </h3>
          <p class="text-center small mb-4 auth-form-copy">Create your account to get started</p>
          <div id="alert-container"></div>
          <form id="signup-form" class="space-y-4">
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control rounded-3" id="full_name" placeholder="Your full name" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control rounded-3" id="email" placeholder="you@email.com" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control rounded-3" id="password" placeholder="••••••" minlength="6"
                maxlength="10" pattern="[A-Za-z0-9]{6,10}" required />
              <div class="form-text">Use 6–10 characters, letters and numbers only</div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 auth-primary-btn" id="signup-btn">
              <span class="btn-text">Create Account</span>
              <span class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
          </form>
          <div class="text-center mt-3">
            <p class="small mt-4 auth-switch">Already have an account? <a href="{{ url_for('index') }}" class="auth-link">Sign
                in</a></p>
          </div>
        </div>
      </div>
      <div class="card mint-soft auth-demo-card">
        <div class="card-body pt-3">
          <div class="d-flex align-items-center gap-2 mb-2">
            <span class="auth-demo-icon">&#10047;</span>
            <span class="small fw-medium auth-demo-title">Demo Mode</span>
          </div>
          <p class="small mb-3 auth-demo-copy">Experience MindLens AI without creating an account</p>
          <a href="{{ url_for('homepage') }}" class="btn btn-mint w-100 btn-sm auth-guest-btn">Continue as Guest</a>
        </div>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('signup-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = document.getElementById('signup-btn');
      const btnText = btn.querySelector('.btn-text');
      const spinner = btn.querySelector('.spinner-border');
      const alertContainer = document.getElementById('alert-container');
      const formData = {
        full_name: document.getElementById('full_name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };
      btn.disabled = true;
      btnText.textContent = 'Creating Account...';
      spinner.classList.remove('d-none');
      alertContainer.innerHTML = '';
      try {
        const response = await fetch('/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });
        if (!response.ok) {
          let errMsg = 'Signup failed';
          try {
            const errData = await response.json();
            errMsg = errData.detail || errData.message || errMsg;
          } catch (e) { }
          throw new Error(errMsg);
        }
        const result = await response.json();
        if (result.success) {
          alertContainer.innerHTML = `
              <div class="alert alert-success alert-dismissible fade show" role="alert">
                <strong>Success!</strong> ${result.message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            `;
          sessionStorage.setItem('signup_email', formData.email);
          setTimeout(() => { window.location.href = "{{ url_for('homepage') }}"; }, 2000);
        } else {
          alertContainer.innerHTML = `
              <div class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong>Error!</strong> ${result.message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            `;
        }
      } catch (error) {
        alertContainer.innerHTML = `
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
              <strong>Error!</strong> ${error.message || 'Something went wrong. Please try again.'}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          `;
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Create Account';
        spinner.classList.add('d-none');
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', path='js/script.js') }}"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindLens AI - Stress Scanner</title>

  <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}" />

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gradient">

  <!-- HEADER -->
  <header class="border-bottom page-topbar">
    <div class="container py-3 d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-2">
        <div class="brand-badge"></div>
        <div>
          <div class="fw-bold text-primary">MindLens</div>
          <div class="small text-muted">AI Wellness</div>
        </div>
      </div>
      <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('homepage') }}">Home</a>
    </div>
  </header>

  <!-- MAIN -->
  <main class="container py-5">

    <div class="text-center mb-4">
      <h1 class="h3 fw-bold">AI Stress Detection</h1>
      <p class="text-muted mx-auto" style="max-width:720px">
        Our AI analyzes facial expressions and posture to detect stress.
      </p>
    </div>

    <div class="row g-4">

      <!-- CAMERA -->
      <div class="col-12 col-lg-6">
        <div class="card wellness-card h-100">
          <div class="card-body">

            <h2 class="h6 mb-2">📷 Camera View</h2>
            <p id="camera-status" class="text-muted small">Ready to scan</p>

            <div class="ratio ratio-16x9 rounded overflow-hidden camera-frame position-relative">
              <video id="camera" autoplay playsinline muted class="w-100 h-100"
                style="object-fit:cover; display: none;">
              </video>
              <div id="face-guide-overlay" class="face-guide-overlay" style="display:none;" aria-hidden="true">
                <div class="face-guide-box">
                  <span class="face-guide-corner corner-tl"></span>
                  <span class="face-guide-corner corner-tr"></span>
                  <span class="face-guide-corner corner-bl"></span>
                  <span class="face-guide-corner corner-br"></span>
                  <span class="face-guide-dot dot-forehead"></span>
                  <span class="face-guide-dot dot-left-eye"></span>
                  <span class="face-guide-dot dot-right-eye"></span>
                  <span class="face-guide-dot dot-nose"></span>
                  <span class="face-guide-dot dot-mouth-left"></span>
                  <span class="face-guide-dot dot-mouth-right"></span>
                  <span class="face-guide-dot dot-chin"></span>
                </div>
              </div>
              <canvas id="face-overlay" class="position-absolute top-0 start-0 w-100 h-100"
                style="pointer-events:none; display:none;"></canvas>
              <div id="face-detection-badge"
                class="position-absolute top-0 start-0 m-3 px-3 py-1 rounded-pill small fw-semibold text-white"
                style="display:none; pointer-events:none; background:rgba(15, 23, 42, 0.7); border:1px solid rgba(90, 255, 180, 0.65);">
                Face detected
              </div>
            </div>

            <div class="d-flex justify-content-center gap-2 mt-3">
              <button id="start-scan" class="btn btn-primary">Start Scan</button>
              <button id="stop-scan" class="btn btn-outline-secondary" disabled>Abort</button>
              <button id="retake" class="btn btn-outline-secondary" disabled>Retake</button>
            </div>

          </div>
        </div>
      </div>

      <!-- RESULT -->
      <div class="col-12 col-lg-6">
        <div class="card wellness-card h-100">
          <div class="card-body">

            <h2 class="h6 mb-2">📊 Scan Analysis</h2>

            <div id="progress-wrap" style="display:none" class="mb-3">
              <div class="d-flex justify-content-between small text-muted mb-1">
                <span id="scan-status-text">Capturing...</span>
                <span id="progress-pct">0%</span>
              </div>
              <div class="progress" style="height: 6px;">
                <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 0%"></div>
              </div>
            </div>

            <div id="results" style="display:none" class="mt-3">
              <div id="scan-results-content"></div>

              <a id="continue-link" href="/dashboard" class="btn btn-mint w-100 mt-3">
                Continue to Dashboard
              </a>
            </div>

            <div id="instructions" class="small text-muted">
              <ul>
                <li>Good lighting</li>
                <li>Face visible</li>
                <li>Relaxed posture</li>
              </ul>
            </div>

          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- SCRIPT -->
  <script>
    const video = document.getElementById('camera');
    const faceGuideOverlay = document.getElementById('face-guide-overlay');
    const faceOverlay = document.getElementById('face-overlay');
    const faceDetectionBadge = document.getElementById('face-detection-badge');
    const overlayCtx = faceOverlay.getContext('2d');
    const startBtn = document.getElementById('start-scan');
    const stopBtn = document.getElementById('stop-scan');
    const retakeBtn = document.getElementById('retake');
    const cameraStatusText = document.getElementById('camera-status');
    const progressWrap = document.getElementById('progress-wrap');
    const progressBar = document.getElementById('progress-bar');
    const progressPct = document.getElementById('progress-pct');
    const scanStatusText = document.getElementById('scan-status-text');
    const results = document.getElementById('results');
    const instructions = document.getElementById('instructions');
    const scanResultsContent = document.getElementById('scan-results-content');

    let stream = null;
    let isScanning = false;
    let capturedFrames = [];
    let faceDetector = null;
    let landmarkRafId = null;
    let landmarkDetectionRunning = false;
    let previousBoxes = [];
    const FACE_CONTOUR_KEYS = ['silhouette', 'lips', 'leftEye', 'rightEye', 'leftEyebrow', 'rightEyebrow'];
    const HIGHLIGHT_KEYPOINT_INDICES = [10, 33, 61, 152, 199, 263, 291];

    async function loadFaceDetector() {
      if (faceDetector) return faceDetector;
      faceDetector = await faceLandmarksDetection.createDetector(
        faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh,
        {
          runtime: 'tfjs',
          maxFaces: 5,
          refineLandmarks: true
        }
      );
      return faceDetector;
    }

    function syncOverlaySize() {
      const rect = video.getBoundingClientRect();
      faceOverlay.width = Math.max(1, Math.round(rect.width));
      faceOverlay.height = Math.max(1, Math.round(rect.height));
    }

    function clearOverlay() {
      overlayCtx.clearRect(0, 0, faceOverlay.width, faceOverlay.height);
    }

    function setFaceDetectionBadge(visible, label = 'Face detected') {
      faceDetectionBadge.textContent = label;
      faceDetectionBadge.style.display = visible ? 'block' : 'none';
    }

    function setFaceGuideVisible(visible) {
      faceGuideOverlay.style.display = visible ? 'block' : 'none';
    }

    function mapPointToOverlay(x, y) {
      const sourceW = video.videoWidth || 640;
      const sourceH = video.videoHeight || 480;
      const overlayW = faceOverlay.width;
      const overlayH = faceOverlay.height;

      const scale = Math.max(overlayW / sourceW, overlayH / sourceH);
      const drawW = sourceW * scale;
      const drawH = sourceH * scale;
      const offsetX = (overlayW - drawW) / 2;
      const offsetY = (overlayH - drawH) / 2;

      return {
        x: (x * scale) + offsetX,
        y: (y * scale) + offsetY
      };
    }

    function lerp(start, end, amount) {
      return start + ((end - start) * amount);
    }

    function getFaceBounds(prediction) {
      const box = prediction.box || prediction.boundingBox || {};
      const keypoints = prediction.keypoints || [];

      let xMin = Number(box.xMin);
      let yMin = Number(box.yMin);
      let xMax = Number(box.xMax);
      let yMax = Number(box.yMax);

      if (!Number.isFinite(xMin) || !Number.isFinite(yMin) || !Number.isFinite(xMax) || !Number.isFinite(yMax)) {
        const topLeft = Array.isArray(box.topLeft) ? box.topLeft[0] || box.topLeft : null;
        const bottomRight = Array.isArray(box.bottomRight) ? box.bottomRight[0] || box.bottomRight : null;
        if (topLeft && bottomRight) {
          xMin = Number(topLeft.x ?? topLeft[0]);
          yMin = Number(topLeft.y ?? topLeft[1]);
          xMax = Number(bottomRight.x ?? bottomRight[0]);
          yMax = Number(bottomRight.y ?? bottomRight[1]);
        }
      }

      if ((!Number.isFinite(xMin) || !Number.isFinite(yMin) || !Number.isFinite(xMax) || !Number.isFinite(yMax)) && keypoints.length > 0) {
        const xs = keypoints.map((pt) => Number(pt.x ?? pt[0])).filter(Number.isFinite);
        const ys = keypoints.map((pt) => Number(pt.y ?? pt[1])).filter(Number.isFinite);
        if (xs.length > 0 && ys.length > 0) {
          xMin = Math.min(...xs);
          yMin = Math.min(...ys);
          xMax = Math.max(...xs);
          yMax = Math.max(...ys);
        }
      }

      if (!Number.isFinite(xMin) || !Number.isFinite(yMin) || !Number.isFinite(xMax) || !Number.isFinite(yMax)) {
        return null;
      }

      const paddingX = (xMax - xMin) * 0.08;
      const paddingY = (yMax - yMin) * 0.12;

      return {
        xMin: Math.max(0, xMin - paddingX),
        yMin: Math.max(0, yMin - paddingY),
        xMax: xMax + paddingX,
        yMax: yMax + paddingY
      };
    }

    function getAnnotationPoints(prediction, key) {
      const points = prediction.annotations?.[key];
      return Array.isArray(points) ? points : [];
    }

    function drawLandmarkPoint(point, radius = 1.5) {
      const mapped = mapPointToOverlay(Number(point.x ?? point[0]), Number(point.y ?? point[1]));
      overlayCtx.beginPath();
      overlayCtx.arc(mapped.x, mapped.y, radius, 0, Math.PI * 2);
      overlayCtx.fill();
    }

    function drawDetectionBox(box) {
      overlayCtx.save();
      overlayCtx.strokeStyle = 'rgba(90, 255, 180, 0.95)';
      overlayCtx.fillStyle = 'rgba(90, 255, 180, 0.08)';
      overlayCtx.lineWidth = 2.5;
      overlayCtx.shadowColor = 'rgba(90, 255, 180, 0.35)';
      overlayCtx.shadowBlur = 16;
      overlayCtx.beginPath();
      overlayCtx.roundRect(box.x, box.y, box.width, box.height, 16);
      overlayCtx.fill();
      overlayCtx.stroke();
      overlayCtx.restore();
    }

    function drawContour(points, closePath = false) {
      if (!points || points.length < 2) return;

      overlayCtx.beginPath();
      points.forEach((point, index) => {
        const mapped = mapPointToOverlay(Number(point.x ?? point[0]), Number(point.y ?? point[1]));
        if (index === 0) {
          overlayCtx.moveTo(mapped.x, mapped.y);
        } else {
          overlayCtx.lineTo(mapped.x, mapped.y);
        }
      });

      if (closePath) {
        overlayCtx.closePath();
      }

      overlayCtx.stroke();
    }

    function drawCornerBrackets(bounds) {
      const topLeft = mapPointToOverlay(bounds.xMin, bounds.yMin);
      const bottomRight = mapPointToOverlay(bounds.xMax, bounds.yMax);
      const width = Math.max(0, bottomRight.x - topLeft.x);
      const height = Math.max(0, bottomRight.y - topLeft.y);
      const bracket = Math.max(14, Math.min(width, height) * 0.14);

      overlayCtx.beginPath();
      overlayCtx.moveTo(topLeft.x, topLeft.y + bracket);
      overlayCtx.lineTo(topLeft.x, topLeft.y);
      overlayCtx.lineTo(topLeft.x + bracket, topLeft.y);

      overlayCtx.moveTo(bottomRight.x - bracket, topLeft.y);
      overlayCtx.lineTo(bottomRight.x, topLeft.y);
      overlayCtx.lineTo(bottomRight.x, topLeft.y + bracket);

      overlayCtx.moveTo(topLeft.x, bottomRight.y - bracket);
      overlayCtx.lineTo(topLeft.x, bottomRight.y);
      overlayCtx.lineTo(topLeft.x + bracket, bottomRight.y);

      overlayCtx.moveTo(bottomRight.x - bracket, bottomRight.y);
      overlayCtx.lineTo(bottomRight.x, bottomRight.y);
      overlayCtx.lineTo(bottomRight.x, bottomRight.y - bracket);
      overlayCtx.stroke();
    }

    function drawFaceMesh(predictions) {
      clearOverlay();

      overlayCtx.strokeStyle = 'rgba(90, 255, 180, 0.95)';
      overlayCtx.fillStyle = 'rgba(255, 255, 180, 0.95)';
      overlayCtx.lineWidth = 1.4;
      overlayCtx.lineJoin = 'round';
      overlayCtx.lineCap = 'round';
      overlayCtx.shadowColor = 'rgba(90, 255, 180, 0.28)';
      overlayCtx.shadowBlur = 10;

      const nextBoxes = [];

      predictions.forEach((prediction, index) => {
        const bounds = getFaceBounds(prediction);
        if (!bounds) return;

        const topLeft = mapPointToOverlay(bounds.xMin, bounds.yMin);
        const bottomRight = mapPointToOverlay(bounds.xMax, bounds.yMax);

        const rawBox = {
          x: topLeft.x,
          y: topLeft.y,
          width: Math.max(0, bottomRight.x - topLeft.x),
          height: Math.max(0, bottomRight.y - topLeft.y)
        };

        const previous = previousBoxes[index];
        const smoothedBox = previous
          ? {
            x: lerp(previous.x, rawBox.x, 0.45),
            y: lerp(previous.y, rawBox.y, 0.45),
            width: lerp(previous.width, rawBox.width, 0.45),
            height: lerp(previous.height, rawBox.height, 0.45)
          }
          : rawBox;

        nextBoxes.push(smoothedBox);
        drawDetectionBox(smoothedBox);

        FACE_CONTOUR_KEYS.forEach((key) => {
          const points = getAnnotationPoints(prediction, key);
          drawContour(points, key === 'leftEye' || key === 'rightEye' || key === 'leftIris' || key === 'rightIris' || key === 'lips');
        });

        const keypoints = Array.isArray(prediction.keypoints) ? prediction.keypoints : [];
        HIGHLIGHT_KEYPOINT_INDICES.forEach((pointIndex) => {
          const point = keypoints[pointIndex];
          if (point) {
            drawLandmarkPoint(point, 2.4);
          }
        });

        drawCornerBrackets({
          xMin: bounds.xMin,
          yMin: bounds.yMin,
          xMax: bounds.xMax,
          yMax: bounds.yMax
        });
      });

      overlayCtx.shadowBlur = 0;
      previousBoxes = nextBoxes;
      setFaceDetectionBadge(nextBoxes.length > 0, nextBoxes.length > 1 ? `${nextBoxes.length} faces detected` : 'Face detected');
    }

    async function detectAndDrawBoxes() {
      if (!landmarkDetectionRunning) return;
      if (!video || video.readyState < 2) {
        landmarkRafId = requestAnimationFrame(detectAndDrawBoxes);
        return;
      }

      try {
        const detector = await loadFaceDetector();
        syncOverlaySize();
        const faces = await detector.estimateFaces(video, { flipHorizontal: false });
        if (faces && faces.length > 0) {
          drawFaceMesh(faces);
        } else {
          previousBoxes = [];
          clearOverlay();
          setFaceDetectionBadge(false);
        }
      } catch (_err) {
        previousBoxes = [];
        clearOverlay();
        setFaceDetectionBadge(false);
      }

      landmarkRafId = requestAnimationFrame(detectAndDrawBoxes);
    }

    function startLandmarkDetection() {
      if (landmarkDetectionRunning) return;
      landmarkDetectionRunning = true;
      setFaceGuideVisible(true);
      faceOverlay.style.display = 'block';
      syncOverlaySize();
      detectAndDrawBoxes();
    }

    function stopLandmarkDetection() {
      landmarkDetectionRunning = false;
      if (landmarkRafId) {
        cancelAnimationFrame(landmarkRafId);
        landmarkRafId = null;
      }
      previousBoxes = [];
      clearOverlay();
      faceOverlay.style.display = 'none';
      setFaceGuideVisible(false);
      setFaceDetectionBadge(false);
    }

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: 640, height: 480 }
        });
        video.srcObject = stream;
        video.style.display = 'block';
        cameraStatusText.textContent = "Adjusting to face...";
        video.onloadedmetadata = () => {
          syncOverlaySize();
          startLandmarkDetection();
        };
        return true;
      } catch (err) {
        alert("Could not access camera: " + err.message);
        resetUI();
        return false;
      }
    }

    function stopCamera() {
      stopLandmarkDetection();
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
        video.srcObject = null;
        video.style.display = 'none';
        cameraStatusText.textContent = "Camera Off";
      }
    }

    async function captureFrame() {
      const canvas = document.createElement('canvas');
      canvas.width = 640; // High resolution for MP/DeepFace
      canvas.height = 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, 640, 480);

      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error("Capture failed"));
        }, 'image/jpeg', 0.85); // Slightly higher quality
      });
    }

    function updateProgress(percent, status) {
      progressBar.style.width = percent + '%';
      progressPct.textContent = percent + '%';
      if (status) scanStatusText.textContent = status;
    }

    function resetUI() {
      startBtn.disabled = false;
      stopBtn.disabled = true;
      retakeBtn.disabled = true;
      progressWrap.style.display = 'none';
      instructions.style.display = 'block';
      results.style.display = 'none';
      isScanning = false;
      // stopCamera(); // Camera must remain live
    }

    function resolveUserEmail() {
      const directEmail = (localStorage.getItem('user_email') || '').trim();
      if (directEmail && directEmail !== 'undefined' && directEmail !== 'null') {
        return directEmail;
      }

      try {
        const userData = JSON.parse(localStorage.getItem('user_data') || '{}');
        const storedEmail = String(userData.email || '').trim();
        if (storedEmail && storedEmail !== 'undefined' && storedEmail !== 'null') {
          localStorage.setItem('user_email', storedEmail);
          return storedEmail;
        }
      } catch (_err) {
      }

      return '';
    }

    async function runScan() {
      if (isScanning) return;
      isScanning = true;
      capturedFrames = [];

      startBtn.disabled = true;
      stopBtn.disabled = false;
      instructions.style.display = 'none';
      progressWrap.style.display = 'block';
      results.style.display = 'none';

      updateProgress(0, "Initializing session...");
      // Camera is already open, but ensure it is ready
      if (!stream) {
          const started = await startCamera();
          if (!started) return;
      }

      try {
        // Rule 1: Wait 2 seconds for user to face camera
        updateProgress(10, "Stabilizing camera (2s)...");
        await new Promise(r => setTimeout(r, 2000));

        // Rule 1: Capture exactly 3 frames over 5 seconds (≈1.6 sec gap)
        for (let i = 0; i < 3; i++) {
          if (!isScanning) break;
          updateProgress(20 + (i * 20), `Burst Capture: Frame ${i + 1}/3...`);
          const blob = await captureFrame();
          capturedFrames.push(blob);
          
          if (i < 2) {
             // Wait ~1.6s between frames
             await new Promise(r => setTimeout(r, 1600)); 
          }
        }

        if (capturedFrames.length === 3) {
          updateProgress(80, "Analyzing Bio-Stress Data...");
          // stopCamera(); // REMOVED: Camera remains LIVE

          const email = resolveUserEmail();
          if (!email) {
            throw new Error("Please sign in before starting a stress scan");
          }

          const formData = new FormData();
          formData.append('email', email);
          capturedFrames.forEach((blob, index) => {
            formData.append('images', blob, `frame_${index}.jpg`);
          });

          const response = await fetch('/scan', { method: 'POST', body: formData });
          if (!response.ok) {
            let message = "Processing failed";
            try {
              const errorBody = await response.json();
              message = errorBody.message || errorBody.detail || message;
            } catch (_err) {
            }
            throw new Error(message);
          }

          const result = await response.json();
          console.log("Scan response data:", result);
          if (result && result.data) {
            localStorage.setItem("latest_scan_result", JSON.stringify(result.data));
            if (email) {
              localStorage.setItem("user_email", email);
              const continueLink = document.getElementById('continue-link');
              if (continueLink) continueLink.href = `/dashboard?email=${encodeURIComponent(email)}`;
            }
          }
          updateProgress(100, "Scan Secured");
          displayResults(result.data);
        }

      } catch (err) {
        alert("System error: " + err.message);
        resetUI();
      } finally {
        isScanning = false;
        stopBtn.disabled = true;
      }
    }

    function displayResults(data) {
      const stressModelScore = Number(data.stress_model_score ?? data.stress_model_stress);
      const mindlensModelScore = Number(data.mindlens_model_score ?? data.mindlens_stress);
      const overallAverageStress = Number(data.overall_average_stress ?? data.avg_stress);
      const hasOverallAverage = Number.isFinite(overallAverageStress);
      const computedOverallStress = hasOverallAverage
        ? (overallAverageStress >= 70 ? 'High' : (overallAverageStress >= 40 ? 'Moderate' : 'Low'))
        : (data.overall_stress || 'Unknown');
      const overallStressClass = computedOverallStress === 'High'
        ? 'text-danger'
        : (computedOverallStress === 'Moderate' ? 'text-warning' : 'text-mint');

      results.style.display = 'block';
      progressWrap.style.display = 'none';
      retakeBtn.disabled = false;

      const emotionColor = data.emotion === 'happy' ? 'text-mint' :
        (['sad', 'anxious', 'angry'].includes(data.emotion) ? 'text-danger' : 'text-primary');

      scanResultsContent.innerHTML = `
        <div class="alert alert-success text-center mb-4 scan-success-banner">
          <h3 class="h5 mb-0">High-Accuracy Synthesis Generated</h3>
          <p class="small mb-0">Exactly 3 frontal frames verified and aggregated</p>
        </div>
        <div class="row g-3">
          <div class="col-6">
            <div class="p-3 bg-light rounded text-center border shadow-sm scan-result-tile">
              <div class="small text-muted mb-1">Emotion (Weighted)</div>
              <div class="h5 fw-bold mb-0 ${emotionColor}">${capitalize(data.emotion)}</div>
              <div class="small text-muted">${Math.round(data.emotion_confidence * 100)}% Confidence</div>
            </div>
          </div>
          <div class="col-6">
            <div class="p-3 bg-light rounded text-center border shadow-sm scan-result-tile">
              <div class="small text-muted mb-1">Overall Stress</div>
              <div class="h5 fw-bold mb-0 ${overallStressClass}">${computedOverallStress}</div>
              <div class="small text-muted">${hasOverallAverage ? overallAverageStress.toFixed(1) : '--'} average score</div>
            </div>
          </div>
          <div class="col-6">
            <div class="p-3 bg-light rounded text-center border shadow-sm scan-result-tile">
              <div class="small text-muted mb-1">Posture Metric</div>
              <div class="h5 fw-bold mb-0 ${data.posture_quality === 'Good' ? 'text-mint' : 'text-warning'}">${data.posture_quality}</div>
              <div class="small text-muted">Slouch Index: ${data.slouch_score ? data.slouch_score.toFixed(2) : '0.00'}</div>
            </div>
          </div>
          <div class="col-6">
            <div class="p-3 bg-light rounded text-center border shadow-sm scan-result-tile">
              <div class="small text-muted mb-1">Facial Tension</div>
              <div class="h5 fw-bold mb-0 ${data.jaw_tension === 'Low' ? 'text-mint' : 'text-danger'}">${data.jaw_tension}</div>
              <div class="small text-muted">Jaw Clench: ${Math.round(data.jaw_clench_score * 100)}%</div>
            </div>
          </div>
          <div class="col-6">
            <div class="p-3 bg-light rounded text-center border shadow-sm scan-result-tile">
              <div class="small text-muted mb-1">MindLens Model</div>
              <div class="h5 fw-bold mb-0 text-primary">${Number.isFinite(mindlensModelScore) ? mindlensModelScore.toFixed(1) : '--'}</div>
              <div class="small text-muted">Model stress score</div>
            </div>
          </div>
          <div class="col-6">
            <div class="p-3 bg-light rounded text-center border shadow-sm scan-result-tile">
              <div class="small text-muted mb-1">Stress Model</div>
              <div class="h5 fw-bold mb-0 text-primary">${Number.isFinite(stressModelScore) ? stressModelScore.toFixed(1) : '--'}</div>
              <div class="small text-muted">Model stress score</div>
            </div>
          </div>
        </div>
      `;
    }

    function capitalize(s) {
      if (typeof s !== 'string') return '';
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    startBtn.onclick = runScan;
    stopBtn.onclick = resetUI;
    retakeBtn.onclick = runScan;

    // Rule 1: Camera opens once when page loads
    window.onload = () => {
      startCamera();
    };

    window.onresize = () => {
      if (landmarkDetectionRunning) {
        syncOverlaySize();
      }
    };
  </script>

</body>

</html>

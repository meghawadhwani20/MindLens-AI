<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindLens AI - Reset Password</title>
    <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}" />
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', path='css/auth.css') }}" />
</head>

<body class="bg-gradient auth-page">
    <div class="min-vh-100 d-flex align-items-center justify-content-center p-4 auth-shell">
        <div class="w-100 auth-panel">
            <div class="text-center auth-brand">
                <div class="d-flex align-items-center justify-content-center gap-3 mb-4">
                    <div class="auth-brand-badge">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                            stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2v20" />
                            <path d="M2 12h20" />
                        </svg>
                    </div>
                    <div class="text-start">
                        <h1 class="h2 fw-bold auth-brand-title m-0">MindLens</h1>
                        <p class="small m-0 auth-brand-subtitle">AI Wellness</p>
                    </div>
                </div>
                <h2 class="h4 auth-heading">Reset password</h2>
                <p class="auth-subheading">Enter your email and choose a new password</p>
            </div>
            <div class="card wellness-card border-0 mb-4 auth-card">
                <div class="card-body">
                    <h3 class="h5 text-center mb-1 d-flex align-items-center justify-content-center gap-2 auth-form-title">
                        <span class="icon-sm">&#10149;</span>
                        Reset Password
                    </h3>
                    <p class="text-center small mb-4 auth-form-copy">Update your password to regain access to your account</p>
                    <div id="alert-container"></div>
                    <form id="reset-form" class="space-y-4">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control rounded-3" id="email" placeholder="you@email.com"
                                required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <input type="password" class="form-control rounded-3" id="new_password"
                                placeholder="Max 10 chars" maxlength="10" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" class="form-control rounded-3" id="confirm_password"
                                placeholder="Max 10 chars" maxlength="10" required />
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 auth-primary-btn" id="reset-btn">
                            <span class="btn-text">Reset Password</span>
                            <span class="spinner-border spinner-border-sm d-none" role="status"></span>
                        </button>
                    </form>
                    <div class="text-center mt-3">
                        <p class="small mt-4 auth-switch">Remember your password? <a href="{{ url_for('index') }}"
                                class="auth-link">Sign in</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('reset-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('reset-btn');
            const alertContainer = document.getElementById('alert-container');
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            if (newPassword !== confirmPassword) {
                alertContainer.innerHTML = `<div class="alert alert-danger">Passwords do not match</div>`;
                return;
            }
            if (newPassword.length > 10) {
                alertContainer.innerHTML = `<div class="alert alert-danger">Password must be maximum 10 characters</div>`;
                return;
            }

            btn.disabled = true;
            try {
                const response = await fetch('/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    })
                });
                const result = await response.json();
                if (result.success) {
                    alertContainer.innerHTML = `<div class="alert alert-success">${result.message}</div>`;
                    setTimeout(() => window.location.href = "{{ url_for('index') }}", 2000);
                } else {
                    alertContainer.innerHTML = `<div class="alert alert-danger">${result.message}</div>`;
                }
            } catch (error) {
                alertContainer.innerHTML = `<div class="alert alert-danger">An error occurred</div>`;
            } finally {
                btn.disabled = false;
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', path='js/script.js') }}"></script>
</body>

</html>
